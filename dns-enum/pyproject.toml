[project]
name = "openaev-dns-enum-injector"
version = "3.261126.0"
description = "An injector enumerating DNS records and subdomains with subfinder and dnsx"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Filigran", email = "contact@filigran.io" },
]
requires-python = ">=3.14,<4.0"

[tool.poetry.dependencies]
pyoaev = "3.261126.0"
injector_common = { path = "../injector_common", develop = true }
pydantic = "^2.11.3"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
flake8 = "^7.3.0"
isort = "^8.0.1"
mypy = "^1.18.2"
pip_audit = "^2.9.0"
pre-commit = "^4.6.0"
ruff = "^0.14.2"
types-PyYAML = "^6.0.12"

[tool.poetry.group.test.dependencies]
coverage = "^7.13.5"
pytest = "^9.1.1"
polyfactory = "^2.22.2"

[tool.poetry]
packages = [
    { include = "dns_enum" },
]

[tool.isort]
profile = "black"
known_local_folder = [
    "dns_enum",
]

[tool.cmw]
install-command = "poetry install"
config-dump-command = "poetry run python -m dns_enum.openaev_dns_enum --dump-config-schema"
icon-path = "dns_enum/img/icon-dns-enum.png"

[build-system]
requires = [
    "poetry-core",
]
build-backend = "poetry.core.masonry.api"
