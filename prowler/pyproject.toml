[project]
name = "openaev-prowler-injector"
version = "3.261023.0"
description = "OpenAEV injector for Prowler cloud security assessments"
readme = "README.md"
authors = [
    { name = "Filigran", email = "contact@filigran.io" },
]
license = "Apache-2.0"
requires-python = ">=3.11,<4.0"

[tool.poetry.dependencies]
python = "^3.11"
pyoaev = "3.261023.0"
requests = "^2.33.0"
pydantic = "^2.13.3"
pydantic-settings = "^2.15.0"
PyYAML = "^6.0.2"
rich = "14.2.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
build = "^1.4.0"
flake8 = "^7.3.0"
isort = "^8.0.1"
mypy = "^1.18.2"
pip-audit = "^2.9.0"
pre-commit = "^4.6.0"
ruff = "^0.14.13"
types-PyYAML = "^6.0.12"
types-requests = "^2.32"

[tool.poetry.group.test.dependencies]
coverage = "^7.13.5"
pytest = "^9.1.1"
polyfactory = "^2.22.2"

[project.scripts]
ProwlerInjector = "prowler.__main__:main"

[tool.poetry]
packages = [
    { include = "prowler" },
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.isort]
profile = "black"
src_paths = [
    "prowler",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "D",
    "B",
    "I",
    "S",
]
ignore = [
    "D104",
    "D203",
    "D211",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S106",
]

[tool.mypy]
strict = true
plugins = [
    "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = [
    "prowler.__main__",
    "prowler.contracts.*",
    "prowler.injector.*",
]
disable_error_code = [
    "import-untyped",
]

[[tool.mypy.overrides]]
module = [
    "prowler.models.configs.config_loader",
    "prowler.models.configs.injector_config_override",
]
disable_error_code = [
    "import-untyped",
    "misc",
]

[build-system]
requires = [
    "poetry-core",
]
build-backend = "poetry.core.masonry.api"
