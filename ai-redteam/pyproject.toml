[tool.poetry]
name = "openaev-ai-redteam-injector"
version = "3.261009.0"
description = "An injector for adversarial exposure validation of LLM models and AI agents (MITRE ATLAS / OWASP)"
authors = [
    "Filigran <contact@filigran.io>",
]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "ai_redteam" },
]

[tool.poetry.dependencies]
python = "^3.11"
injector_common = { path = "../injector_common", develop = true }
pyyaml = "^6.0.1"
pyoaev = "3.261009.0"
requests = "^2.32.0"
pydantic = "^2.11.3"

[tool.poetry.group.dev.dependencies]
black = "^26.3.0"
flake8 = "^7.3.0"
isort = "^8.0.1"
mypy = "^1.17.1"
pip-audit = "^2.9.0"
pre-commit = "^4.6.0"
ruff = "^0.14.13"

[tool.poetry.group.test.dependencies]
coverage = "^7.13.5"
pytest = "^9.1.1"
polyfactory = "^2.22.2"

[tool.isort]
profile = "black"
known_local_folder = [
    "ai_redteam",
]

[tool.cmw]
install-command = "poetry install"
config-dump-command = "poetry run python -m ai_redteam.openaev_ai_redteam --dump-config-schema"
icon-path = "ai_redteam/img/icon-ai-redteam.png"

[build-system]
requires = [
    "poetry-core",
]
build-backend = "poetry.core.masonry.api"
