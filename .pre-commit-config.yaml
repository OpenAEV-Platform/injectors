repos:
-   repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
    -   id: black
-   repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
    -   id: flake8
        args: ['--ignore=E,W']
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
    -   id: check-yaml
-   repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
    - id: isort
      name: isort (python)
      args: ['--profile', 'black']
